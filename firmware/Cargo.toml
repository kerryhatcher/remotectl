[package]
edition      = "2024"
name         = "xiao-firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
mipidsi = "0.10.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
heapless = { version = "0.9.3", features = ["serde"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
serde = { version = "1", default-features = false, features = ["derive"] }
embassy-usb = "0.6"



remotectl-shared = { path = "../shared", features = ["radio"] }

lora-phy = "3.0.1"
ed25519-dalek = { version = "2", default-features = false }
